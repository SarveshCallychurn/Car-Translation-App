[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Optional: if your Netlify plan allows longer functions, raise the limit here (seconds).
# [functions."translate"]
#   timeout = 26

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
